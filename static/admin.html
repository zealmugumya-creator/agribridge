<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AgriBridge — Admin</title>
<style>
  :root{--bg:#0f1310;--bg2:#171c18;--bg3:#1e2620;--border:#2c352b;--text:#e8efe8;--text2:#9fb0a2;--green:#2ecc71;--green-dim:#123821;--amber:#f0a020;--red:#e05555}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:0}
  a{color:var(--green)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--border)}
  header h1{font-size:1.1rem;font-weight:800}
  header .sub{color:var(--text2);font-size:.8rem}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:700}
  .btn{background:var(--green);color:#04210f;padding:10px 16px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 12px}
  .btn.sm{padding:5px 10px;font-size:.78rem}
  input,select{font-family:inherit;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;font-size:.95rem}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  /* login */
  #login{max-width:380px;margin:8vh auto}
  #login h2{font-size:1.3rem;margin-bottom:6px}
  #login p{color:var(--text2);font-size:.85rem;margin-bottom:18px}
  .field{margin-bottom:12px}
  .err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-top:8px}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat .n{font-size:1.6rem;font-weight:800;color:var(--green)}
  .stat .l{color:var(--text2);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{background:var(--bg3);color:var(--text2);padding:8px 14px;border-radius:20px;font-size:.85rem}
  .tab.active{background:var(--green-dim);color:var(--green)}
  /* table */
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:560px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--text2);font-weight:700;font-size:.72rem;text-transform:uppercase}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:capitalize;background:var(--bg3);color:var(--text2)}
  .badge.pending{background:rgba(240,180,40,.15);color:#e0a91e}
  .badge.confirmed{background:rgba(70,140,240,.15);color:#5b9bff}
  .badge.in_transit{background:rgba(120,110,240,.15);color:#8f86ff}
  .badge.delivered{background:rgba(40,190,110,.15);color:var(--green)}
  .badge.cancelled{background:rgba(224,85,85,.15);color:var(--red)}
  .muted{color:var(--text2)}
  .hidden{display:none}
  .loading{color:var(--text2);padding:20px;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card">
  <h2>🌾 AgriBridge Admin</h2>
  <p>Enter the admin password to continue.</p>
  <div class="field"><input type="password" id="pwd" placeholder="Admin password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn" style="width:100%" onclick="doLogin()">Log In</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
  <header>
    <div><h1>🌾 AgriBridge Admin</h1><div class="sub" id="who">Signed in</div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="refreshAll()">↻ Refresh</button><button class="btn ghost sm" onclick="logout()">Log out</button></div>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <div class="tab active" data-tab="orders" onclick="showTab('orders',this)">Orders</div>
      <div class="tab" data-tab="farmers" onclick="showTab('farmers',this)">Users</div>
      <div class="tab" data-tab="listings" onclick="showTab('listings',this)">Listings</div>
    </div>
    <div class="card"><div id="panel" class="tblwrap"><div class="loading">Loading…</div></div></div>
  </div>
</div>

<script>
  var API = 'https://agribridge-1-og7a.onrender.com';
  var TOKEN = sessionStorage.getItem('ab_admin_token') || '';
  var currentTab = 'orders';

  function h(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
  function fmt(n){return 'UGX '+(Number(n)||0).toLocaleString('en-UG');}
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, TOKEN?{'Authorization':'Bearer '+TOKEN}:{});
    return fetch(API+path, opts).then(function(r){ if(r.status===401){ logout(); throw new Error('unauthorized'); } return r.json().catch(function(){return null;}); });
  }

  async function doLogin(){
    var pwd = document.getElementById('pwd').value;
    var errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    if(!pwd){ errEl.textContent='Enter the password.'; return; }
    try{
      var res = await fetch(API+'/api/admin/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) });
      var j = await res.json().catch(function(){return null;});
      if(res.ok && j && j.token){
        TOKEN = j.token; sessionStorage.setItem('ab_admin_token', TOKEN);
        showDash();
      } else {
        errEl.textContent = (j && j.error) ? j.error : 'Login failed.';
      }
    }catch(e){ errEl.textContent = 'Could not reach the server. Try again in ~30s (it may be waking up).'; }
  }

  function showDash(){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    refreshAll();
  }
  function logout(){
    TOKEN=''; sessionStorage.removeItem('ab_admin_token');
    document.getElementById('dash').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
  }

  async function refreshAll(){ await loadStats(); await loadTab(currentTab); }

  async function loadStats(){
    var el = document.getElementById('stats');
    try{
      var s = await api('/api/admin/stats');
      if(!s){ el.innerHTML=''; return; }
      var cards = [['Users',s.farmers],['Listings',s.listings],['Animals',s.animals],['Orders',s.orders],['Paid revenue',fmt(s.revenue_ugx)]];
      el.innerHTML = cards.map(function(c){ return '<div class="stat"><div class="n">'+(typeof c[1]==='number'?c[1]:h(c[1]))+'</div><div class="l">'+c[0]+'</div></div>'; }).join('');
    }catch(e){ /* handled */ }
  }

  function showTab(t, node){
    currentTab = t;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    if(node) node.classList.add('active');
    loadTab(t);
  }

  async function loadTab(t){
    var panel = document.getElementById('panel');
    panel.innerHTML = '<div class="loading">Loading…</div>';
    try{
      if(t==='orders')   return renderOrders(await api('/api/admin/orders'));
      if(t==='farmers')  return renderFarmers(await api('/api/admin/farmers'));
      if(t==='listings') return renderListings(await api('/api/admin/listings'));
    }catch(e){ panel.innerHTML = '<div class="loading">Could not load.</div>'; }
  }

  function renderOrders(rows){
    rows = Array.isArray(rows)?rows:[];
    if(!rows.length){ document.getElementById('panel').innerHTML='<div class="loading">No orders yet.</div>'; return; }
    var opts = ['pending','confirmed','in_transit','delivered','cancelled'];
    var body = rows.map(function(o){
      var st = o.status||'pending';
      var amt = o.total_price||o.total_amount||0;
      var sel = '<select class="sm" style="width:auto;padding:5px 8px" onchange="setStatus(\''+h(o.id)+'\',this.value)">'+opts.map(function(v){return '<option value="'+v+'"'+(v===st?' selected':'')+'>'+v+'</option>';}).join('')+'</select>';
      return '<tr><td>'+h(o.payment_ref || (o.tracking_code||'') || (o.id||'').slice(0,8))+'</td>'
        +'<td>'+h(o.buyer_phone||'—')+'</td>'
        +'<td>'+(o.quantity_kg||0)+' kg</td>'
        +'<td>'+fmt(amt)+'</td>'
        +'<td><span class="badge '+st+'">'+st+'</span></td>'
        +'<td><span class="badge '+(o.payment_status==='paid'?'delivered':'pending')+'">'+h(o.payment_status||'unpaid')+'</span></td>'
        +'<td>'+sel+'</td></tr>';
    }).join('');
    document.getElementById('panel').innerHTML = '<table><thead><tr><th>Ref</th><th>Buyer</th><th>Qty</th><th>Amount</th><th>Status</th><th>Payment</th><th>Set status</th></tr></thead><tbody>'+body+'</tbody></table>';
  }

  async function setStatus(id, status){
    try{
      var r = await api('/api/admin/order/'+encodeURIComponent(id)+'/status',{ method:'PATCH', body:JSON.stringify({status:status}) });
      loadStats();
    }catch(e){ alert('Could not update status.'); }
  }

  function renderFarmers(rows){
    rows = Array.isArray(rows)?rows:[];
    if(!rows.length){ document.getElementById('panel').innerHTML='<div class="loading">No users yet.</div>'; return; }
    var body = rows.map(function(f){
      return '<tr><td>'+h(f.full_name||'—')+'</td><td>'+h(f.phone||'—')+'</td><td>'+h(f.email||'—')+'</td><td>'+h(f.district||'—')+'</td><td>'+(f.is_verified?'✅':'—')+'</td></tr>';
    }).join('');
    document.getElementById('panel').innerHTML = '<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>District</th><th>Verified</th></tr></thead><tbody>'+body+'</tbody></table>';
  }

  function renderListings(rows){
    rows = Array.isArray(rows)?rows:[];
    if(!rows.length){ document.getElementById('panel').innerHTML='<div class="loading">No listings yet.</div>'; return; }
    var body = rows.map(function(l){
      return '<tr><td>'+h(l.crop_name||l.title||'—')+'</td><td>'+h(l.category||'—')+'</td><td>'+(l.quantity_kg||0)+' kg</td><td>'+fmt(l.price_per_kg)+'/kg</td><td>'+h(l.district||'—')+'</td><td>'+(l.is_available?'✅':'—')+'</td></tr>';
    }).join('');
    document.getElementById('panel').innerHTML = '<table><thead><tr><th>Crop</th><th>Category</th><th>Qty</th><th>Price</th><th>District</th><th>Live</th></tr></thead><tbody>'+body+'</tbody></table>';
  }

  // Auto-enter if a valid token is already stored.
  if(TOKEN){ api('/api/admin/verify').then(function(v){ if(v && v.valid){ showDash(); } else { logout(); } }).catch(function(){ logout(); }); }
</script>
</body>
</html>
