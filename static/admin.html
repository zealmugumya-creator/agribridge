<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AgriBridge — Admin</title>
<style>
  :root{--bg:#0f1310;--bg2:#171c18;--bg3:#1e2620;--border:#2c352b;--text:#e8efe8;--text2:#9fb0a2;--green:#2ecc71;--green-dim:#123821;--amber:#f0a020;--red:#e05555}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:var(--green)}
  .wrap{max-width:1150px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
  header h1{font-size:1.1rem;font-weight:800}
  header .sub{color:var(--text2);font-size:.8rem}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:700}
  .btn{background:var(--green);color:#04210f;padding:10px 16px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 12px}
  .btn.amber{background:var(--amber);color:#3a2600}
  .btn.red{background:transparent;border:1px solid var(--red);color:var(--red)}
  .btn.sm{padding:5px 10px;font-size:.78rem}
  input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;font-size:.95rem}
  label{display:block;font-size:.8rem;color:var(--text2);margin:10px 0 4px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  #login{max-width:380px;margin:8vh auto}
  #login h2{font-size:1.3rem;margin-bottom:6px}
  #login p{color:var(--text2);font-size:.85rem;margin-bottom:18px}
  .err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-top:8px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat .n{font-size:1.6rem;font-weight:800;color:var(--green)}
  .stat .l{color:var(--text2);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em}
  #overviewExtras{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:18px}
  @media(min-width:760px){ #overviewExtras{grid-template-columns:1.5fr 1fr} }
  .ov-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px}
  .ov-head{font-weight:800;font-size:.95rem;margin-bottom:16px}
  .ov-head small{color:var(--text2);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
  .ov-chart{display:flex;align-items:flex-end;gap:10px;height:150px}
  .ov-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .ov-bar-fill{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#4be08a,var(--green));min-height:4px;transition:height .4s}
  .ov-bar-val{font-size:.72rem;font-weight:700;color:var(--text)}
  .ov-bar-lbl{font-size:.7rem;color:var(--text2)}
  .ov-qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ov-qa button{display:flex;align-items:center;gap:8px;justify-content:flex-start;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:.85rem;font-weight:700}
  .ov-qa button:hover{border-color:var(--green);color:var(--green)}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{background:var(--bg3);color:var(--text2);padding:8px 14px;border-radius:20px;font-size:.85rem}
  .tab.active{background:var(--green-dim);color:var(--green)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{max-width:260px}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{color:var(--text2);font-weight:700;font-size:.72rem;text-transform:uppercase}
  td .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg3)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:capitalize;background:var(--bg3);color:var(--text2)}
  .badge.pending{background:rgba(240,180,40,.15);color:#e0a91e}
  .badge.confirmed{background:rgba(70,140,240,.15);color:#5b9bff}
  .badge.in_transit{background:rgba(120,110,240,.15);color:#8f86ff}
  .badge.delivered,.badge.available,.badge.active,.badge.paid{background:rgba(40,190,110,.15);color:var(--green)}
  .badge.cancelled,.badge.failed,.badge.sold,.badge.rejected{background:rgba(224,85,85,.15);color:var(--red)}
  .badge.completed{background:rgba(40,190,110,.15);color:var(--green)}
  .cnt{background:var(--amber);color:#3a2600;border-radius:999px;padding:0 7px;font-size:.7rem;font-weight:800;margin-left:4px}
  .cnt:empty{display:none}
  select.svc-st{width:auto;padding:5px 8px;font-size:.78rem}
  .muted{color:var(--text2)}
  .hidden{display:none}
  .loading{color:var(--text2);padding:20px;text-align:center}
  .rowbtns{display:flex;gap:6px;white-space:nowrap}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px;z-index:100;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:520px;margin-top:2vh}
  .modal h3{font-size:1.1rem;margin-bottom:4px}
  .modal .close{float:right;background:none;color:var(--text2);font-size:1.2rem}
  .media-preview{margin-top:6px}
  .media-preview img,.media-preview video{max-width:100%;max-height:160px;border-radius:8px}
  .savebar{display:flex;gap:8px;margin-top:16px}
  .up-status{font-size:.75rem;color:var(--text2);margin-top:4px}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>🌾 AgriBridge Admin</h2>
  <p>Enter the admin password to continue.</p>
  <input type="password" id="pwd" placeholder="Admin password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">Log In</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="dash" class="hidden">
  <header>
    <div><h1>🌾 AgriBridge Admin</h1><div class="sub">Full management console</div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="refreshAll()">↻ Refresh</button><button class="btn ghost sm" onclick="logout()">Log out</button></div>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div id="overviewExtras"></div>
    <div class="tabs">
      <div class="tab active" data-tab="orders"   onclick="showTab('orders',this)">Orders</div>
      <div class="tab" data-tab="listings" onclick="showTab('listings',this)">Crop Listings</div>
      <div class="tab" data-tab="animals"  onclick="showTab('animals',this)">Animals</div>
      <div class="tab" data-tab="deliveries" onclick="showTab('deliveries',this)">Deliveries</div>
      <div class="tab" data-tab="supplies" onclick="showTab('supplies',this)">Supplies</div>
      <div class="tab" data-tab="farmers"  onclick="showTab('farmers',this)">Users</div>
      <div class="tab" data-tab="requests" onclick="showTab('requests',this)">Requests</div>
      <div class="tab" data-tab="offers"   onclick="showTab('offers',this)">Offers</div>
      <div class="tab" data-tab="cold_storage"   onclick="showTab('cold_storage',this)">❄️ Cold Storage<span class="cnt" id="cnt_cold_storage"></span></div>
      <div class="tab" data-tab="cold_transport" onclick="showTab('cold_transport',this)">🚚 Cold Transport<span class="cnt" id="cnt_cold_transport"></span></div>
      <div class="tab" data-tab="loans"          onclick="showTab('loans',this)">💰 Loans<span class="cnt" id="cnt_loans"></span></div>
      <div class="tab" data-tab="transporters" onclick="showTab('transporters',this)">🚛 Transporters</div>
      <div class="tab" data-tab="matching"     onclick="showTab('matching',this)" style="color:#60d090;">🔗 Matching</div>
      <div class="tab" data-tab="scans"        onclick="showTab('scans',this)" style="color:#60b0d0;">🌿 Scans</div>
      <div class="tab" data-tab="activity"     onclick="showTab('activity',this)" style="color:#c0a0e0;">📊 Activity</div>
      <div class="tab" data-tab="errors"       onclick="showTab('errors',this)" style="color:#f87171;">⚠ Errors</div>
      <a href="/logistics.html" class="tab" style="color:#2ec471;text-decoration:none;border-left:2px solid #2ec471;margin-left:8px;" title="Logistics Command Center">🗺 Logistics</a>
    </div>
    <div class="card">
      <div class="toolbar">
        <input id="search" placeholder="Filter…" oninput="renderCurrent()">
        <button class="btn sm amber" id="addBtn" onclick="openCreate()">+ Add</button>
      </div>
      <div id="panel" class="tblwrap"><div class="loading">Loading…</div></div>
    </div>
  </div>
</div>

<!-- Edit / create modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <button class="close" onclick="closeEdit()">✕</button>
    <h3 id="editTitle">Edit</h3>
    <div id="editFields"></div>
    <div class="savebar">
      <button class="btn" style="flex:1" id="saveBtn" onclick="saveEdit()">Save</button>
    </div>
    <div class="err" id="editErr"></div>
  </div>
</div>

<script>
  var API = 'https://agribridge-1-og7a.onrender.com';
  var SUPA_URL = 'https://lvloaweijidgcuezdnmu.supabase.co';
  var SUPA_KEY = 'sb_publishable_lzjlixcVLCUVg9MDy5adFw_pgxTz03y';
  var TOKEN = sessionStorage.getItem('ab_admin_token') || '';
  var currentTab = 'orders';
  var DATA = { orders:[], listings:[], animals:[], farmers:[], requests:[], offers:[], transporters:[], matching:[], errors:[], cold_storage:[], cold_transport:[], loans:[] };
  // Admin tab -> service_requests.kind (cold storage, refrigerated transport and loan requests)
  var SVC_TABS = { cold_storage:'cold_storage', cold_transport:'refrigerated_transport', loans:'loan' };
  var SVC_STATUSES = ['pending','confirmed','completed','rejected','cancelled'];
  var editState = null; // {table, id, isNew}

  function h(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
  function fmt(n){return 'UGX '+(Number(n)||0).toLocaleString('en-UG');}
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, TOKEN?{'Authorization':'Bearer '+TOKEN}:{});
    return fetch(API+path, opts).then(function(r){ if(r.status===401){ logout(); throw new Error('unauthorized'); } return r.json().catch(function(){return null;}); });
  }

  // ── Field definitions per table ─────────────────────────────────
  var FIELDS = {
    listings: [
      {k:'crop_name',label:'Crop name',t:'text'},
      {k:'category',label:'Category',t:'select',opts:['staples','vegetables','fruits','cash crops']},
      {k:'price_per_kg',label:'Price (UGX/kg)',t:'number'},
      {k:'quantity_kg',label:'Quantity (kg)',t:'number'},
      {k:'unit',label:'Unit',t:'text'},
      {k:'district',label:'District',t:'text'},
      {k:'description',label:'Description',t:'textarea'},
      {k:'discount_pct',label:'Discount %',t:'number'},
      {k:'is_available',label:'Available (shown in market)',t:'check'},
      {k:'is_organic',label:'Organic',t:'check'},
      {k:'is_verified',label:'Verified',t:'check'},
      {k:'farmer_phone',label:'Seller phone',t:'text'},
      {k:'image_url',label:'Photo',t:'image'},
      {k:'video_url',label:'Video',t:'video'}
    ],
    animal_listings: [
      {k:'name',label:'Animal / listing name',t:'text'},
      {k:'species',label:'Species',t:'text'},
      {k:'category',label:'Category',t:'select',opts:['livestock','poultry','dairy','aqua','apiary','pigs']},
      {k:'price',label:'Price (UGX)',t:'number'},
      {k:'qty',label:'Quantity available',t:'number'},
      {k:'unit',label:'Unit',t:'text'},
      {k:'district',label:'District',t:'text'},
      {k:'description',label:'Description',t:'textarea'},
      {k:'status',label:'Status',t:'select',opts:['active','sold','hidden']},
      {k:'health_cert',label:'Health certificate',t:'check'},
      {k:'maaif_certified',label:'MAAIF certified',t:'check'},
      {k:'farmer_name',label:'Seller name',t:'text'},
      {k:'farmer_phone',label:'Seller phone',t:'text'},
      {k:'image_url',label:'Photo',t:'image'},
      {k:'video_url',label:'Video',t:'video'}
    ],
    farmers: [
      {k:'full_name',label:'Name',t:'text'},
      {k:'phone',label:'Phone',t:'text'},
      {k:'email',label:'Email',t:'text'},
      {k:'district',label:'District',t:'text'},
      {k:'is_verified',label:'Verified',t:'check'},
      {k:'is_premium',label:'Premium',t:'check'}
    ],
    orders: [
      {k:'status',label:'Order status',t:'select',opts:['pending','confirmed','in_transit','delivered','cancelled']},
      {k:'payment_status',label:'Payment status',t:'select',opts:['unpaid','paid']},
      {k:'delivery_address',label:'Delivery address',t:'text'},
      {k:'notes',label:'Notes',t:'textarea'}
    ],
    deliveries: [
      {k:'tracking_code',label:'Tracking code',t:'text'},
      {k:'status',label:'Delivery status',t:'select',opts:['scheduled','picked_up','in_transit','at_checkpoint','delivered','failed']},
      {k:'driver_name',label:'Driver name',t:'text'},
      {k:'driver_phone',label:'Driver phone',t:'text'},
      {k:'pickup_location',label:'Pickup location',t:'text'},
      {k:'delivery_location',label:'Delivery location',t:'text'},
      {k:'estimated_arrival',label:'Estimated arrival',t:'text'},
      {k:'notes',label:'Notes',t:'textarea'}
    ],
    transporters: [
      {k:'full_name',label:'Full name',t:'text'},
      {k:'phone',label:'Phone (07…)',t:'text'},
      {k:'email',label:'Email',t:'text'},
      {k:'vehicle_type',label:'Vehicle type',t:'select',opts:['pickup','lorry','motorcycle','minibus','van','tractor']},
      {k:'plate_number',label:'Number plate',t:'text'},
      {k:'district',label:'District',t:'text'},
      {k:'capacity_kg',label:'Capacity (kg)',t:'number'},
      {k:'notes',label:'Notes / MOU ref',t:'textarea'},
      {k:'status',label:'Account status',t:'select',opts:['active','inactive']},
      {k:'is_available',label:'Available now',t:'check'}
    ],
    supplier_products: [
      {k:'name',label:'Product name',t:'text'},
      {k:'category',label:'Category',t:'select',opts:['seeds','fertilizer','pesticide','tool','animal_supply']},
      {k:'brand',label:'Brand',t:'text'},
      {k:'price',label:'Price (UGX)',t:'number'},
      {k:'unit',label:'Unit',t:'text'},
      {k:'badge',label:'Badge / tag',t:'text'},
      {k:'description',label:'Description',t:'textarea'},
      {k:'image_id',label:'Unsplash photo id',t:'text'},
      {k:'in_stock',label:'In stock (shown in app)',t:'check'}
    ]
  };
  var TABLE_OF = { orders:'orders', listings:'listings', animals:'animal_listings', deliveries:'deliveries', supplies:'supplier_products', farmers:'farmers', requests:'purchase_requests', offers:'offers', transporters:'transporters' };

  // ── Auth ────────────────────────────────────────────────────────
  async function doLogin(){
    var pwd=document.getElementById('pwd').value, e=document.getElementById('loginErr'); e.textContent='';
    if(!pwd){ e.textContent='Enter the password.'; return; }
    try{
      var res=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
      var j=await res.json().catch(function(){return null;});
      if(res.ok&&j&&j.token){ TOKEN=j.token; sessionStorage.setItem('ab_admin_token',TOKEN); showDash(); }
      else e.textContent=(j&&j.error)?j.error:'Login failed.';
    }catch(err){ e.textContent='Could not reach the server. Wait ~30s (it may be waking up) and retry.'; }
  }
  function showDash(){ document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); refreshAll(); }
  function logout(){ TOKEN=''; sessionStorage.removeItem('ab_admin_token'); document.getElementById('dash').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }

  async function refreshAll(){ await loadStats(); await Promise.all([load('orders'),load('listings'),load('animals'),load('deliveries'),load('supplies'),load('farmers'),load('requests'),load('offers'),load('transporters'),load('cold_storage'),load('cold_transport'),load('loans')]); renderOverviewExtras(); renderCurrent(); }

  function showTabByName(t){ var node=document.querySelector('.tab[data-tab="'+t+'"]'); showTab(t,node||undefined); if(node) node.scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // Platform Overview chart (real orders/month) + Quick Actions, mockup style.
  function renderOverviewExtras(){
    var el=document.getElementById('overviewExtras'); if(!el) return;
    var orders=DATA.orders||[];
    var now=new Date(), months=[], idx={};
    for(var k=6;k>=0;k--){ var d=new Date(now.getFullYear(), now.getMonth()-k, 1);
      var key=d.getFullYear()+'-'+d.getMonth();
      idx[key]=months.length;
      months.push({label:d.toLocaleString('en-US',{month:'short'}), count:0}); }
    for(var i=0;i<orders.length;i++){ var o=orders[i]; if(!o.created_at) continue;
      var od=new Date(o.created_at); var ky=od.getFullYear()+'-'+od.getMonth();
      if(ky in idx) months[idx[ky]].count++; }
    var counts=months.map(function(m){return m.count;});
    var max=Math.max.apply(null, counts.concat([1]));
    var bars=months.map(function(m){ var hp=Math.round(m.count/max*100);
      return '<div class="ov-bar"><div class="ov-bar-val">'+m.count+'</div><div class="ov-bar-fill" style="height:'+Math.max(4,hp)+'%"></div><div class="ov-bar-lbl">'+m.label+'</div></div>';
    }).join('');
    el.innerHTML=
      '<div class="ov-card"><div class="ov-head">Platform Overview<small>orders / month</small></div><div class="ov-chart">'+bars+'</div></div>'+
      '<div class="ov-card"><div class="ov-head">Quick Actions</div><div class="ov-qa">'+
        '<button onclick="showTabByName(\'farmers\')">👤 Verify Users</button>'+
        '<button onclick="showTabByName(\'orders\')">📦 Manage Orders</button>'+
        '<button onclick="showTabByName(\'deliveries\')">🚚 Deliveries</button>'+
        '<button onclick="showTabByName(\'supplies\')">🏪 Supplies</button>'+
        '<button onclick="showTabByName(\'requests\')">📋 Requests</button>'+
        '<button onclick="showTabByName(\'transporters\')">🚛 Transporters</button>'+
        '<button onclick="showTabByName(\'matching\')">🔗 Match Orders</button>'+
      '</div></div>';
  }

  async function loadStats(){
    try{
      var s=await api('/api/admin/stats'); if(!s) return;
      var cards=[['Total Users',s.farmers],['Crop Listings',s.listings],['Animals',s.animals],['Total Orders',s.orders],['Transporters',s.transporters||0],['Total Revenue',fmt(s.revenue_ugx)]];
      document.getElementById('stats').innerHTML=cards.map(function(c){return '<div class="stat"><div class="n">'+(typeof c[1]==='number'?c[1]:h(c[1]))+'</div><div class="l">'+c[0]+'</div></div>';}).join('');
    }catch(e){}
  }
  async function load(tab){
    var pathMap = {orders:'/api/admin/orders',listings:'/api/admin/listings',animals:'/api/admin/animals',deliveries:'/api/admin/deliveries',supplies:'/api/admin/supplies',farmers:'/api/admin/farmers',requests:'/api/admin/purchase-requests',offers:'/api/admin/offers',transporters:'/api/admin/transporters',cold_storage:'/api/admin/service-requests?kind=cold_storage',cold_transport:'/api/admin/service-requests?kind=refrigerated_transport',loans:'/api/admin/service-requests?kind=loan',matching:'/api/admin/match-candidates',errors:'/api/admin/events',scans:'/api/admin/events?event_type=scan',activity:'/api/admin/events?severity=info'};
    var path = pathMap[tab] || ('/api/admin/'+tab);
    try{ var rows=await api(path); DATA[tab]=Array.isArray(rows)?rows:[]; }catch(e){ DATA[tab]=[]; }
    if(SVC_TABS[tab]) updateSvcCounts();
  }

  async function runMatching(){
    if(!confirm('Run the matching algorithm now? This will match open purchase requests with available listings.')) return;
    try{
      var r=await api('/api/worker/match',{method:'POST',body:JSON.stringify({})});
      if(r&&r.ok){
        var msg='Matching complete! Processed: '+(r.requests_processed||0)+', Offers sent: '+(r.offers||0)+', Expired: '+(r.expired||0)+'.';
        alert(msg);
      } else {
        alert('Matching returned: '+(r&&r.error?r.error:'unknown result'));
      }
      await load('requests'); await load('offers'); renderCurrent();
    }catch(e){ alert('Matching failed: '+(e&&e.message?e.message:'check server logs.')); }
  }

  function showTab(t,node){ currentTab=t; document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');}); if(node)node.classList.add('active'); document.getElementById('search').value=''; var noAdd=['orders','requests','offers','cold_storage','cold_transport','loans','errors','matching','scans','activity']; document.getElementById('addBtn').style.display=noAdd.indexOf(t)>-1?'none':'inline-block'; load(t).then(renderCurrent); }

  function match(row,q){ if(!q)return true; q=q.toLowerCase(); return JSON.stringify(row).toLowerCase().indexOf(q)>-1; }

  function renderCurrent(){
    var q=document.getElementById('search').value;
    var rows=(DATA[currentTab]||[]).filter(function(r){return match(r,q);});
    if(SVC_TABS[currentTab])    return renderServiceRequests(rows, currentTab);
    if(currentTab==='orders')   return renderOrders(rows);
    if(currentTab==='listings') return renderListings(rows);
    if(currentTab==='animals')  return renderAnimals(rows);
    if(currentTab==='deliveries') return renderDeliveries(rows);
    if(currentTab==='supplies')  return renderSupplies(rows);
    if(currentTab==='farmers')   return renderFarmers(rows);
    if(currentTab==='requests')  return renderRequests(rows);
    if(currentTab==='offers')    return renderOffers(rows);

  function renderMatching(){
    var data=DATA.matching||[];

    var candidates=Array.isArray(data)?data:(data.candidates||[]);
    if(!candidates.length){ panelMsg('No pending orders to match. 🎉'); return; }
    var html=candidates.map(function(c){
      var o=c.order||{};
      var farmers=c.farmer_matches||[];
      var transporters=c.available_transporters||[];
      var farmerOpts=farmers.map(function(f,i){ return '<option value="'+h(f.farmer_phone)+'|'+h(f.farmer_id||'')+'|'+h(f.crop_name||'')+'">'+h(f.crop_name)+' · '+h(f.district||'—')+' · UGX '+Number(f.price_per_kg||0).toLocaleString()+'/kg · '+h(f.farmer_phone)+'</option>'; }).join('');
      var trOpts='<option value="">— No transporter yet —</option>'+transporters.map(function(t){ return '<option value="'+h(t.id)+'">'+h(t.full_name)+' · '+h(t.vehicle_type||'—')+' · '+h(t.district||'—')+'</option>'; }).join('');
      var matchSection=farmers.length
        ? '<label>Select farmer match:</label><select id="f_'+h(o.id)+'" style="margin-bottom:6px">'+farmerOpts+'</select>'
          +'<label>Assign transporter (optional):</label><select id="t_'+h(o.id)+'" style="margin-bottom:6px">'+trOpts+'</select>'
          +'<label>Notes to farmer/transporter:</label><input id="n_'+h(o.id)+'" type="text" placeholder="e.g. collect by Friday">'
          +'<button class="btn sm" style="margin-top:8px;width:100%" onclick="approveMatch(\''+h(o.id)+'\')">✅ Approve & Notify</button>'
        : '<p style="color:var(--amber);font-size:.82rem">⚠ No active farmer listings found for this order. Add a matching crop listing first.</p>';
      return '<div class="card" style="margin-bottom:12px">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
        +'<div><strong>Order '+h(o.ref||o.id.slice(0,8))+'</strong> &nbsp;<span class="badge pending">pending</span></div>'
        +'<div class="muted" style="font-size:.8rem">'+h(o.created_at?new Date(o.created_at).toLocaleString('en-UG'):'')+'</div></div>'
        +'<div style="font-size:.85rem;margin-bottom:8px">📍 '+h(o.delivery_address||'—')+' &nbsp;·&nbsp; 💰 UGX '+Number(o.total_price||0).toLocaleString()+'</div>'
        +matchSection
        +'</div>';
    }).join('');
    setPanel('<div style="margin-bottom:10px;color:var(--text2);font-size:.82rem">'+candidates.length+' pending order(s) awaiting a farmer match</div>'+html);

  async function approveMatch(orderId){
    var fSel=document.getElementById('f_'+orderId);
    var tSel=document.getElementById('t_'+orderId);
    var nIn=document.getElementById('n_'+orderId);
    if(!fSel||!fSel.value){ alert('Please select a farmer match first.'); return; }
    var parts=fSel.value.split('|');
    var farmerPhone=parts[0]||'', farmerName=parts[2]||'Farmer';
    var transporterId=tSel?tSel.value:'';
    var notes=nIn?nIn.value.trim():'';
    if(!confirm('Approve match for order '+orderId.slice(0,8)+'?\nFarmer: '+farmerPhone+(transporterId?'\nTransporter assigned':''))) return;
    try{
      var r=await api('/api/admin/match-approve',{method:'POST',body:JSON.stringify({order_id:orderId,farmer_phone:farmerPhone,farmer_name:farmerName,transporter_id:transporterId||null,notes:notes})});
      if(r&&r.ok){
        var sms=r.sms||{};
        alert('Match approved!\nSMS to farmer: '+(sms.farmer||'not sent (AT not configured)')+'\nSMS to transporter: '+(sms.transporter||'N/A'));
        await load('matching'); await load('orders'); renderCurrent();
      } else { alert('Error: '+(r&&r.error?r.error:'unknown')); }
    }catch(e){ alert('Request failed: '+e.message); }
  }

  function buildForm(tab,row,isNew){
    editState={ tab:tab, table:TABLE_OF[tab], id:row.id, isNew:isNew };
    document.getElementById('editTitle').textContent=(isNew?'Add ':'Edit ')+tab.replace('s','');
    document.getElementById('editErr').textContent='';
    var fields=FIELDS[TABLE_OF[tab]]||[];
    var html=fields.map(function(f){
      var v=row[f.k];
      if(f.t==='textarea') return fieldWrap(f,'<textarea id="ef_'+f.k+'">'+h(v||'')+'</textarea>');
      if(f.t==='check')    return fieldWrap(f,'<label style="display:flex;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" id="ef_'+f.k+'" style="width:auto" '+(v?'checked':'')+'> '+h(f.label)+'</label>',true);
      if(f.t==='select')   return fieldWrap(f,'<select id="ef_'+f.k+'">'+f.opts.map(function(o){return '<option '+(String(v)===o?'selected':'')+'>'+o+'</option>';}).join('')+'</select>');
      if(f.t==='image'||f.t==='video'){
        var accept=f.t==='image'?'image/*':'video/*';
        var prev=v?(f.t==='image'?'<img src="'+h(v)+'">':'<video src="'+h(v)+'" controls></video>'):'';
        return '<label>'+h(f.label)+'</label>'+
          '<input type="hidden" id="ef_'+f.k+'" value="'+h(v||'')+'">'+
          '<input type="file" accept="'+accept+'" onchange="uploadField(this,\''+f.k+'\',\''+f.t+'\')">'+
          '<div class="up-status" id="up_'+f.k+'"></div>'+
          '<div class="media-preview" id="pv_'+f.k+'">'+prev+'</div>';
      }
      return fieldWrap(f,'<input type="'+(f.t==='number'?'number':'text')+'" id="ef_'+f.k+'" value="'+h(v==null?'':v)+'">');
    }).join('');
    document.getElementById('editFields').innerHTML=html;
    document.getElementById('editOverlay').classList.add('open');
  }
  function fieldWrap(f,inner,noLabel){ return (noLabel?'':'<label>'+h(f.label)+'</label>')+inner; }
  function closeEdit(){ document.getElementById('editOverlay').classList.remove('open'); editState=null; }

  async function uploadField(input,key,kind){
    var file=input.files&&input.files[0]; if(!file) return;
    var maxMB=kind==='video'?25:5;
    if(file.size> maxMB*1024*1024){ document.getElementById('up_'+key).textContent=(kind==='video'?'Video':'Image')+' too large (max '+maxMB+'MB)'; return; }
    document.getElementById('up_'+key).textContent='Uploading…';
    var url=await uploadToStorage(file, kind==='video'?'admin-video':'admin-photo');
    if(url){ document.getElementById('ef_'+key).value=url; document.getElementById('up_'+key).textContent='✓ uploaded';
      document.getElementById('pv_'+key).innerHTML=kind==='image'?'<img src="'+h(url)+'">':'<video src="'+h(url)+'" controls></video>';
    } else document.getElementById('up_'+key).textContent='Upload failed';
  }
  async function uploadToStorage(file, prefix){
    try{
      var ext=((file.name||'file').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
      var path=prefix+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      var res=await fetch(SUPA_URL+'/storage/v1/object/uploads/'+path,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});
      if(!res.ok) return null;
      return SUPA_URL+'/storage/v1/object/public/uploads/'+path;
    }catch(e){ return null; }
  }

  async function saveEdit(){
    if(!editState) return;
    var fields={};
    (FIELDS[editState.table]||[]).forEach(function(f){
      var el=document.getElementById('ef_'+f.k); if(!el) return;
      if(f.t==='check') fields[f.k]=el.checked;
      else if(f.t==='number'){ var n=el.value===''?null:Number(el.value); fields[f.k]=n; }
      else fields[f.k]=el.value;
    });
    document.getElementById('editErr').textContent='';
    document.getElementById('saveBtn').disabled=true; document.getElementById('saveBtn').textContent='Saving…';
    try{
      var body={ table:editState.table, fields:fields };
      var method='PATCH';
      if(editState.isNew){ method='POST'; } else { body.id=editState.id; }
      var r=await api('/api/admin/row',{ method:method, body:JSON.stringify(body) });
      if(r&&r.ok){ closeEdit(); await load(editState.tab); await loadStats(); renderCurrent(); }
      else document.getElementById('editErr').textContent=(r&&r.error)?r.error:'Save failed.';
    }catch(e){ document.getElementById('editErr').textContent='Save failed.'; }
    document.getElementById('saveBtn').disabled=false; document.getElementById('saveBtn').textContent='Save';
  }

  async function delRow(tab,id){
    if(!confirm('Delete this '+tab.replace('s','')+'? This cannot be undone.')) return;
    try{
      var r=await api('/api/admin/row',{ method:'DELETE', body:JSON.stringify({ table:TABLE_OF[tab], id:id }) });
      if(r&&r.ok){ await load(tab); await loadStats(); renderCurrent(); }
      else alert((r&&r.error)||'Delete failed.');
    }catch(e){ alert('Delete failed.'); }
  }

  if(TOKEN){ api('/api/admin/verify').then(function(v){ if(v&&v.valid) showDash(); else logout(); }).catch(function(){ logout(); }); }
</script>
</body>
</html>
