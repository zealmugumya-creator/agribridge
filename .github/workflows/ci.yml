name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint + type + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"        # matches render.yaml runtime
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app.py services/ tests/

      - name: Type check (mypy, non-blocking report)
        continue-on-error: true
        run: mypy services/ --ignore-missing-imports || true

      - name: Unit + integration tests
        env:
          FLASK_ENV: development
        run: pytest -q --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml

  # NOTE: SQL migration tests and Android .aab builds need live credentials
  # (Supabase DB, Android SDK/signing) and are documented as external steps in
  # docs/IMPLEMENTATION_STATUS.md and docs/PLAY_STORE_RELEASE.md. They are
  # intentionally NOT faked here.
