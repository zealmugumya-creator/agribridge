name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint + type + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"        # matches render.yaml runtime
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app.py services/ scripts/ tests/

      - name: Legal documents are built and up to date
        run: python scripts/build_legal.py --check

      - name: Type check (mypy, non-blocking report)
        continue-on-error: true
        run: mypy services/ --ignore-missing-imports || true

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Unit + integration + browser tests
        env:
          FLASK_ENV: development
        run: |
          set +e
          pytest -q --junitxml=reports/pytest.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Pytest failed. The JUnit failure details follow."
            cat reports/pytest.xml || true
          fi
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml

      - name: Publish which tests failed
        if: failure()
        # Action logs are readable only by someone signed in to the repo, so a
        # red run tells an unauthenticated caller nothing. Annotations are
        # served by the public commits API, which is how a failure gets
        # diagnosed at all. Same reasoning as the SQL job below.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse('reports/pytest.xml').getroot()
          except Exception:
              print('::error::No JUnit report was written, so no test name is available')
              raise SystemExit(0)
          bad = [tc for tc in root.iter('testcase')
                 if tc.find('failure') is not None or tc.find('error') is not None]
          for tc in bad:
              node = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
              message = ' '.join((node.get('message') or '').split())
              name = f"{tc.get('classname', '')}::{tc.get('name', '')}"
              print(f"::error::{name}: {message[:600]}")
          print(f"::notice::{len(bad)} failing test(s) reported")
          PY

  sql:
    name: Migration 0007 on real PostgreSQL (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: tests/sql
      - name: Run the SQL tests, keeping the output of the file that fails
        working-directory: tests/sql
        # Each file builds its own in-process PGlite, so they run one at a time
        # in a fixed order. The output of each is kept: action logs are only
        # readable by someone signed in to the repo, so a red job otherwise
        # tells an unauthenticated caller nothing. This caught the 2026-10-29
        # run, where `npm test` failed but every file passed on a later re-run
        # and the reason was already gone.
        run: |
          set -o pipefail
          failed=0
          for f in legal_consent ledger security_lockdown category_orders settlements \
                   pesapal farmer_ratings order_write_lockdown transport_assignment proof_bucket; do
            log="$RUNNER_TEMP/sql-$f.log"
            if ! node "$f.test.mjs" 2>&1 | tee "$log"; then
              detail="$(tr '\r\n' '  ' <"$log" | tail -c 700)"
              echo "::error::SQL test $f.test.mjs failed: $detail"
              failed=1
            fi
          done
          exit "$failed"

  # NOTE: SQL tests for migrations 0001-0006 and Android .aab builds need live credentials
  # (Supabase DB, Android SDK/signing) and are documented as external steps in
  # docs/IMPLEMENTATION_STATUS.md and docs/PLAY_STORE_RELEASE.md. They are
  # intentionally NOT faked here. (SQL tests exist only for migration 0007 so far.)
  # (older note) SQL migration tests and Android .aab builds need live credentials
  # (Supabase DB, Android SDK/signing) and are documented as external steps in
  # docs/IMPLEMENTATION_STATUS.md and docs/PLAY_STORE_RELEASE.md. They are
  # intentionally NOT faked here.
